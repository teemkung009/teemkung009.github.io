<!doctype html><html><head><link rel=stylesheet href="../fonts/fonts.css"></head><body style="margin:0;background:#333"><canvas id=c width=3240 height=3840 style="width:1080px"></canvas>
<script src="../js/core.js"></script><script src="../js/sets.js"></script><script src="../js/inserts.js"></script><script src="../js/engine.js"></script><script>
(async()=>{for(const f of ['600 20px Mitr','500 20px Mitr','600 20px Kanit','500 20px Sarabun','700 20px Sarabun']) await document.fonts.load(f,'กขค abc');
const ctx=document.getElementById('c').getContext('2d');
const fns=[t=>insStrap(ctx,1.2,0.7),t=>insWipe(ctx,1.3),t=>insDevices(ctx,1,{bat:0.18,tap:1}),t=>insDevices(ctx,1,{bat:0.4,charging:1,plug:1,hand:1}),t=>insBuild(ctx,1.3),t=>insCode(ctx,3),
t=>insNotebook(ctx,6,[{text:'ไม่เข้าใจ ลองถาม',start:0,dur:2,underline:'#f2784b'},{text:'ค่อย ๆ กล้าทีละนิด',start:2.5,dur:3}]),t=>insLunch(ctx,1),t=>{insScreen(ctx,1,0.8);drawSubtitle(ctx,'ผมเรียนสาขาวิทยาการคอมพิวเตอร์\nและตอนนี้กำลังฝึกงานอยู่ที่สถาบัน',1);drawTimeChip(ctx,'09:00–10:00 น.',1);drawNameTag(ctx,'ครูปีใหม่','สอนรอบเช้า',400,700,1);drawThought(ctx,'เราจะทำได้ดีไหม',540,400,1)}];
fns.forEach((f,i)=>{ctx.save();ctx.translate((i%3)*1080,Math.floor(i/3)*1280);ctx.scale(2/3,2/3);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();f();ctx.restore();});
})();
</script></body></html>
