<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกฝึกงานของทีม EP.1</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg: #14161d; --fg: #f3f4f7; --muted: #9aa1b2; --accent: #f2784b; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #eef0f4; --fg: #1d2130; --muted: #5d6478; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Sarabun", system-ui, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  .stage { position: relative; width: min(100vw - 32px, calc((100vh - 120px) * 9 / 16)); aspect-ratio: 9 / 16; margin-top: 16px; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.35); background: #000; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bar { width: min(100vw - 32px, calc((100vh - 120px) * 9 / 16)); display: flex; gap: 10px; align-items: center; margin: 12px 0 18px; }
  button { font: 600 15px "Mitr", sans-serif; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .time { font: 500 14px "Mitr", monospace; color: var(--muted); min-width: 92px; text-align: right; }
  .hint { color: var(--muted); font-size: 13px; margin-bottom: 18px; text-align: center; padding: 0 16px; }
  body.render .bar, body.render .hint { display: none; }
  body.render .stage { width: 1080px; height: 1920px; margin: 0; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="scene" width="1080" height="1920"></canvas>
    <canvas id="text" width="1080" height="1920"></canvas>
  </div>
  <div class="bar">
    <button id="play">▶ เล่น</button>
    <input id="seek" type="range" min="0" max="209.16" step="0.01" value="0">
    <span class="time" id="time">0:00 / 3:29</span>
  </div>
  <div class="hint">แอนิเมชัน 2D 1080×1920 · 30 fps · ภาพวาดสด (canvas) ซิงก์กับเสียงบรรยาย · ตัวอักษรอยู่บนเลเยอร์แยก</div>
  <audio id="vo" src="audio/narration.wav" preload="auto"></audio>

  <script src="js/core.js"></script>
  <script src="js/sets.js"></script>
  <script src="js/inserts.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/subtitles.js"></script>
  <script src="js/shots.js"></script>
  <script>
  (async () => {
    const params = new URLSearchParams(location.search);
    const renderMode = params.has('render');
    if (renderMode) document.body.classList.add('render');
    const fonts = ['500 40px Mitr', '600 40px Mitr', '600 40px Kanit', '500 40px Sarabun', '700 40px Sarabun'];
    await Promise.all(fonts.map(f => document.fonts.load(f, 'กขคงจ ABC 0123')));
    Object.keys(SETS).forEach(setImg);  // pre-paint sets
    const sc = document.getElementById('scene').getContext('2d');
    const tc = document.getElementById('text').getContext('2d');
    window.__draw = (T) => { renderScene(sc, T); renderText(tc, T); };
    // compositor for the offline renderer: scene + text into one JPEG
    const comp = makeCanvas(W, H), cc = comp.getContext('2d');
    window.__frame = (T, q = 0.93) => { window.__draw(T); cc.drawImage(sc.canvas, 0, 0); cc.drawImage(tc.canvas, 0, 0); return comp.toDataURL('image/jpeg', q); };
    window.__ready = true;
    const t0 = parseFloat(params.get('t') || '0');
    window.__draw(t0);
    if (renderMode) return;

    const vo = document.getElementById('vo'), seek = document.getElementById('seek'), play = document.getElementById('play'), time = document.getElementById('time');
    const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    vo.currentTime = t0; seek.value = t0;
    play.onclick = () => { if (vo.paused) vo.play(); else vo.pause(); };
    vo.onplay = () => play.textContent = '❚❚ หยุด'; vo.onpause = () => play.textContent = '▶ เล่น';
    seek.oninput = () => { vo.currentTime = +seek.value; window.__draw(+seek.value); };
    const loop = () => {
      const T = Math.min(vo.currentTime, DURATION);
      if (!vo.paused) { window.__draw(T); seek.value = T; }
      time.textContent = `${fmt(T)} / ${fmt(DURATION)}`;
      requestAnimationFrame(loop);
    };
    loop();
  })();
  </script>
</body>
</html>
